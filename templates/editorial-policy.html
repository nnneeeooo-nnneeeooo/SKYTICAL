{% extends "base.html" %}
{% block content %}
  <main class="article-page">
    <span class="card-kicker">{{ policy.kicker }}</span>
    <h1 class="article-title">{{ policy.title }}</h1>
    <p class="text-muted" style="font-size:15px;line-height:1.8;">{{ policy.intro }}</p>
    {% for section in policy.sections %}
    <section style="border-top:1px solid var(--color-divider);padding-top:20px;margin-top:24px;">
      <h2 style="font-size:22px;margin:0 0 12px;">{{ section.title }}</h2>
      {% for paragraph in section.body %}
      <p style="font-size:15px;line-height:1.9;margin:0 0 12px;">{{ paragraph }}</p>
      {% endfor %}
    </section>
    {% endfor %}
    <p style="margin-top:28px;">
      <a class="btn btn-primary" href="{{ contact_url }}" target="_blank" rel="noopener">{{ policy.contactLabel }} ↗</a>
    </p>
  </main>
{% endblock %}
