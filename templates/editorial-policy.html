{% extends "base.html" %}
{% block content %}
  <main class="article-page">
    <span class="card-kicker">{{ policy.kicker }}</span>
    <h1 class="article-title">{{ policy.title }}</h1>
    <p class="text-muted policy-intro">{{ policy.intro }}</p>
    {% for section in policy.sections %}
    <section class="policy-section">
      <h2 class="policy-section-title">{{ section.title }}</h2>
      {% for paragraph in section.body %}
      <p class="policy-paragraph">{{ paragraph }}</p>
      {% endfor %}
    </section>
    {% endfor %}
    <p class="policy-contact">
      <a class="btn btn-primary" href="{{ contact_url }}">{{ policy.contactLabel }} ↗</a>
    </p>
  </main>
{% endblock %}
