{% set slides = a.image_slides %}
{% set image = slides[0].image %}
<script type="application/json" id="hero-candidates">{{ slides | tojson }}</script>
<div id="hero-carousel" class="hero-carousel article-figure" data-article-gallery role="region"
     aria-roledescription="carousel" data-rotation-ms="2500"
     aria-label="{% if lang == 'zh' %}新聞配圖輪播{% else %}News image carousel{% endif %}">
  <figure id="hero-story-link" class="hero-story article-gallery-figure">
    <img id="hero-story-image" src="{{ image.url }}" alt="{{ image.subject }}"
         data-fallback-src="{{ base }}/assets/skytical-social.png?v={{ asset_version }}"
         fetchpriority="high" decoding="async" class="article-image">
    <figcaption class="text-muted article-caption article-caption--row">
      <span data-image-description class="article-caption-subject">{{ image.subject }}</span>
      <span data-image-kind{% if not slides[0].kind_label %} hidden{% endif %}>{{ slides[0].kind_label }}</span>
      <span data-image-model{% if not slides[0].model_label %} hidden{% endif %}>{{ slides[0].model_label }}</span>
      <span data-image-credit{% if not image.credit %} hidden{% endif %}>© {{ image.credit or '' }}</span>
      <span data-image-license{% if not image.license %} hidden{% endif %}>{{ image.license or '' }}</span>
      <a id="hero-image-source" href="{{ image.link or '' }}" target="_blank" rel="noopener"{% if not image.link %} hidden{% endif %}>{{ image.provider or t.photoSource }}</a>
    </figcaption>
  </figure>
  <button id="hero-prev" class="hero-nav hero-nav--prev" type="button" aria-label="{% if lang == 'zh' %}上一張配圖{% else %}Previous image{% endif %}">‹</button>
  <button id="hero-next" class="hero-nav hero-nav--next" type="button" aria-label="{% if lang == 'zh' %}下一張配圖{% else %}Next image{% endif %}">›</button>
  <div id="hero-dots" class="hero-dots" aria-label="{% if lang == 'zh' %}選擇新聞配圖{% else %}Choose a news image{% endif %}">
    {% for slide in slides %}<button type="button" class="hero-dot{% if loop.first %} active{% endif %}" data-hero-index="{{ loop.index0 }}"
      aria-label="{% if lang == 'zh' %}第 {{ loop.index }} 張配圖{% else %}Image {{ loop.index }}{% endif %}"{% if loop.first %} aria-current="true"{% endif %}></button>{% endfor %}
  </div>
  <noscript><style>[data-article-gallery] > .hero-nav,[data-article-gallery] > .hero-dots{display:none}</style></noscript>
</div>
