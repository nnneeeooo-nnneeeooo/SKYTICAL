name: Temporary topic-specific real photo discovery
on:
  push:
    branches: [editorial/backfill-all-missing-real-photos-20261107]
    paths: [scripts/collect_anchor_photos.py, .github/workflows/temporary-photo-anchors.yml]
permissions:
  contents: write
jobs:
  anchors:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Discover subject-verified licensed photograph candidates
        run: python scripts/collect_anchor_photos.py
      - name: Commit candidate catalog
        run: |
          git config user.name "SKYTICAL Photo Audit"
          git config user.email "skytical-photo-audit@users.noreply.github.com"
          git add data/photo-anchors.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: record topic-specific licensed photograph candidates"
            git push
          fi
