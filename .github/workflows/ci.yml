name: regression-ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Compile pipeline and tests
        run: python -m compileall -q pipeline tests

      - name: Run legacy isolated regression scripts
        env:
          GEMINI_API_KEY: ""
          NVIDIA_API_KEY: ""
          OPENROUTER_API_KEY: ""
          OPENCODE_API_KEY: ""
          WECHAT_API_KEY: ""
          AEROAPI_KEY: ""
          ADSBLOL_API_KEY: ""
          AIRPLANES_LIVE_API_KEY: ""
        run: |
          for test in \
            tests/test_pla.py \
            tests/test_usage.py \
            tests/test_grounded.py \
            tests/test_fulltext.py \
            tests/test_glossary.py \
            tests/test_companion.py \
            tests/test_briefing.py \
            tests/test_images.py \
            tests/test_manufacturer_sources.py
          do
            echo "== $test =="
            python "$test"
          done

      - name: Run native pytest suite
        env:
          GEMINI_API_KEY: ""
          NVIDIA_API_KEY: ""
          OPENROUTER_API_KEY: ""
          OPENCODE_API_KEY: ""
          WECHAT_API_KEY: ""
          AEROAPI_KEY: ""
          ADSBLOL_API_KEY: ""
          AIRPLANES_LIVE_API_KEY: ""
        run: python -m pytest -q

      - name: Verify production build
        run: python pipeline/build.py
