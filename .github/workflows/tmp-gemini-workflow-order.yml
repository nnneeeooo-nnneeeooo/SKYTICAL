name: tmp-gemini-workflow-order

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.head_ref == 'agent/gemini-3-7-workflow-order'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Update workflow provider order
        run: |
          python - <<'PY'
          from pathlib import Path

          old = 'opencode:claude-sonnet-4-6,opencode:gpt-5.5,gemini:gemini-3.6-flash,opencode:gemini-3.1-pro,opencode:qwen3.6-plus,nvidia:z-ai/glm-5.2,opencode:glm-5.1,opencode:kimi-k2.6,gemini:gemini-3.5-flash,nvidia:deepseek-ai/deepseek-v4-pro,nvidia:nvidia/nemotron-3-ultra-550b-a55b,openrouter:nvidia/nemotron-3-ultra-550b-a55b:free,nvidia:qwen/qwen3.5-397b-a17b,nvidia:nvidia/nemotron-3-super-120b-a12b,openrouter:nvidia/nemotron-3-super-120b-a12b:free,nvidia:mistralai/mistral-medium-3.5-128b,openrouter:google/gemma-4-31b-it:free,openrouter:inclusionai/ling-3.0-flash:free,openrouter:google/gemma-4-26b-a4b-it:free,openrouter:nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free,openrouter:openai/gpt-oss-20b:free,openrouter:nvidia/nemotron-3-nano-30b-a3b:free,openrouter:nvidia/nemotron-nano-12b-v2-vl:free,openrouter:nvidia/nemotron-nano-9b-v2:free,openrouter:poolside/laguna-s-2.1:free,openrouter:cohere/north-mini-code:free,openrouter:poolside/laguna-xs-2.1:free'
          new = 'opencode:claude-sonnet-4-6,opencode:gpt-5.5,gemini:gemini-3.7-flash,gemini:gemini-3.6-flash,opencode:gemini-3.1-pro,opencode:qwen3.6-plus,nvidia:z-ai/glm-5.2,opencode:glm-5.1,opencode:kimi-k2.6,gemini:gemini-3.5-flash,nvidia:deepseek-ai/deepseek-v4-pro,nvidia:nvidia/nemotron-3-ultra-550b-a55b,openrouter:nvidia/nemotron-3-ultra-550b-a55b:free,nvidia:qwen/qwen3.5-397b-a17b,nvidia:nvidia/nemotron-3-super-120b-a12b,openrouter:nvidia/nemotron-3-super-120b-a12b:free,nvidia:mistralai/mistral-medium-3.5-128b,openrouter:google/gemma-4-31b-it:free,openrouter:inclusionai/ling-3.0-flash:free,openrouter:google/gemma-4-26b-a4b-it:free,openrouter:nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free,openrouter:openai/gpt-oss-20b:free,openrouter:nvidia/nemotron-3-nano-30b-a3b:free,openrouter:nvidia/nemotron-nano-12b-v2-vl:free,openrouter:nvidia/nemotron-nano-9b-v2:free,openrouter:poolside/laguna-s-2.1:free,openrouter:cohere/north-mini-code:free,openrouter:poolside/laguna-xs-2.1:free'
          for path in ('.github/workflows/hourly.yml', '.github/workflows/briefing.yml'):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'old provider order not found in {path}')
              text = text.replace(old, new, 1)
              if old in text or new not in text:
                  raise SystemExit(f'provider order check failed in {path}')
              p.write_text(text, encoding='utf-8')
          PY

      - name: Verify configured order matches model priority
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'pipeline')
          from model_config import DEFAULT_PROVIDER_ORDER
          for path in ('.github/workflows/hourly.yml', '.github/workflows/briefing.yml'):
              line = next(line for line in Path(path).read_text(encoding='utf-8').splitlines() if 'AVWIRE_PROVIDER_ORDER:' in line)
              configured = line.split('AVWIRE_PROVIDER_ORDER:', 1)[1].strip()
              assert configured == DEFAULT_PROVIDER_ORDER, (path, configured, DEFAULT_PROVIDER_ORDER)
          print('workflow provider order matches DEFAULT_PROVIDER_ORDER')
          PY

      - name: Commit workflow fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/hourly.yml .github/workflows/briefing.yml
          git commit -m 'fix: use Gemini 3.7 workflow order'
          git push origin HEAD:${{ github.head_ref }}
