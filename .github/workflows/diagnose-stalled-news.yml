name: diagnose-stalled-news
on:
  push:
    branches: [ops/diagnose-stalled-news-20260930]
permissions:
  actions: write
  contents: read
jobs:
  stop-stalled-run:
    runs-on: ubuntu-latest
    steps:
      - name: Stop the exact stalled recovery run
        env:
          GH_RUN_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import datetime, json, os, urllib.request
          root = "https://api.github.com/repos/nnneeeooo-nnneeeooo/SKYTICAL/actions/runs/36707544074"
          headers = {"Authorization": "Bearer " + os.environ["GH_RUN_TOKEN"], "Accept": "application/vnd.github+json"}
          with urllib.request.urlopen(urllib.request.Request(root, headers=headers), timeout=30) as response:
              run = json.load(response)
          assert run["head_sha"] == "a0fd69b602e23054be269549559affc6f136b686"
          assert run["name"] == "hourly-update" and run["head_branch"] == "main"
          if run["status"] == "completed":
              print("The run has already completed; no action taken")
          else:
              started = datetime.datetime.fromisoformat(run["updated_at"].replace("Z", "+00:00"))
              assert (datetime.datetime.now(datetime.timezone.utc) - started).total_seconds() > 3600
              request = urllib.request.Request(root + "/cancel", data=b"", headers=headers, method="POST")
              with urllib.request.urlopen(request, timeout=30) as response:
                  assert response.status == 202
              print("Cancelled stalled news recovery run 36707544074 for log inspection")
          PY
