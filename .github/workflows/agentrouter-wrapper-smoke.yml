name: agentrouter-wrapper-smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/agentrouter-wrapper-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Reproduce wrapper with Python urllib
        env:
          AGENTROUTER_API: ${{ secrets.AGENTROUTER_API }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AGENTROUTER_API:-}"
          python - <<'PY'
          import json, os, ssl, urllib.request, urllib.error

          key = os.environ['AGENTROUTER_API']
          ctx = ssl.create_default_context()
          common_headers = {
              'Authorization': f'Bearer {key}',
              'User-Agent': 'opencode/1.17.12',
              'Accept-Encoding': 'identity',
              'Content-Type': 'application/json',
              'Accept': 'application/json',
          }

          tests = [
              ('chat', 'https://agentrouter.org/v1/chat/completions', {
                  'model': 'gpt-5.6-sol',
                  'messages': [
                      {'role': 'system', 'content': 'Return concise plain text.'},
                      {'role': 'user', 'content': 'Reply with exactly OK'},
                  ],
                  'stream': False,
              }),
              ('messages', 'https://agentrouter.org/v1/messages', {
                  'model': 'gpt-5.6-sol',
                  'max_tokens': 8,
                  'messages': [{'role': 'user', 'content': 'Reply with exactly OK'}],
                  'stream': False,
              }),
          ]

          waf_hits = 0
          api_hits = 0
          for name, url, payload in tests:
              body = json.dumps(payload, separators=(',', ':')).encode()
              req = urllib.request.Request(url, data=body, headers=common_headers, method='POST')
              try:
                  resp = urllib.request.urlopen(req, context=ctx, timeout=30)
                  status = resp.status
                  ctype = resp.headers.get('Content-Type', '')
                  raw = resp.read()
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  ctype = exc.headers.get('Content-Type', '')
                  raw = exc.read()
              text = raw.decode('utf-8', errors='replace')
              is_waf = 'aliyun_waf_' in text or '<!doctype html>' in text.lower()
              print(f'{name}: HTTP {status}; Content-Type={ctype}; bytes={len(raw)}; waf={is_waf}')
              if is_waf:
                  waf_hits += 1
                  continue
              api_hits += 1
              try:
                  obj = json.loads(raw)
              except Exception:
                  print(f'{name}: non-WAF non-JSON response')
                  continue
              if isinstance(obj, dict):
                  choices = obj.get('choices') or []
                  if choices:
                      content = ((choices[0].get('message') or {}).get('content') or '').strip()
                      print(f'{name}: model response received={bool(content)}; returned_model={obj.get("model", "unknown")}')
                  else:
                      err = obj.get('error') or obj.get('message') or obj.get('type') or 'unknown'
                      if isinstance(err, dict):
                          err = err.get('message') or err.get('type') or err.get('code') or 'unknown'
                      print(f'{name}: API response summary={str(err)[:160]}')

          if waf_hits == len(tests):
              raise SystemExit('Both AgentRouter API paths were intercepted by Aliyun WAF before reaching the API')
          if api_hits == 0:
              raise SystemExit('No AgentRouter API response reached')
          PY
