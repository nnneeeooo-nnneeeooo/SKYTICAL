name: manual-article-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/deploy-trigger"

concurrency:
  group: manual-article-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build site from committed data
        env:
          AVWIRE_USAGE_TOKEN: ${{ secrets.AVWIRE_USAGE_TOKEN }}
          BRIEFING_INCLUDE_ARTICLES: ${{ vars.BRIEFING_INCLUDE_ARTICLES }}
        run: python pipeline/build.py

      - name: Scan publishable output
        run: |
          scan() {
            set +e
            grep -rInE "$1" site/ data/
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "::error::$2 found in publishable output"
              exit 1
            elif [ "$rc" -ge 2 ]; then
              echo "::error::scan failed (grep rc=$rc)"
              exit 1
            fi
          }
          scan "nvapi-[A-Za-z0-9_-]{16,}|AIza[0-9A-Za-z_-]{20,}|sk-ant-[A-Za-z0-9_-]{16,}|Bearer [A-Za-z0-9_./+-]{20,}" "secret-like string"
          scan "reasoning_content|<think>" "reasoning trace"
          echo "scan: site/ and data/ clean"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment
