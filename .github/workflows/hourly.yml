name: hourly-update

on:
  schedule:
    - cron: "45 * * * *" # hourly; staggered away from the top of the hour
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/hourly.yml"
      - "pipeline/adsb.py"
      - "pipeline/flightwatch.py"
      - "pipeline/flightnews.py"
      - "pipeline/write.py"
      - "pipeline/images.py"
      - "pipeline/providers.py"
      - "pipeline/model_config.py"
      - "pipeline/provider_health.py"
      - "pipeline/free_provider_probe.py"
      - "config/free_provider_probe.json"
      - "pipeline/article_schema.py"
      - "pipeline/build.py"
      - "pipeline/admin_page.py"
      - "static/admin*.js"
      - "static/admin.css"
      - "templates/admin*.html"
      - "pipeline/public_article.py"
      - "pipeline/common.py"
      - "pipeline/data_merge.py"
      - "pipeline/roundup_images.py"
      - ".gitattributes"
      - "pipeline/dedupe.py"
      - "pipeline/fulltext.py"
      - "pipeline/source_recovery.py"
      - "pipeline/draft_recovery.py"
      - "pipeline/news_retry.py"
      - "pipeline/editorial_policy.py"
      - "pipeline/luna_editorial.py"
      - "pipeline/paid_budget*.py"
      - "config/luna_policy.json"
      - "pipeline/industry_roundup.py"
      - "pipeline/manual_draft.py"
      - "pipeline/airport_codes.py"
      - "config/airport_iata_aliases.json"
      - "tests/**"
  push:
    branches: [main]
    paths-ignore:
      - "data/**" # bot data commits must not retrigger the workflow

jobs:
  regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Run complete isolated Python regression suite
        run: python -m pytest -q

      - name: Run all JavaScript regression suites
        run: |
          for test in tests/test_*.js; do
            node "$test"
          done
          for source in static/*.js; do
            node --check "$source"
          done

      - name: Validate committed publication data
        run: |
          python pipeline/image_selection.py
          python tests/test_recent_image_quality.py
          python pipeline/scheduled_news.py

  update:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: skytical-paid-api-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write # commits data/ back to the repo
      issues: write # create one assigned US$2 daily Terra usage alert
      pages: write # configure-pages enablement
    steps:
      - uses: actions/checkout@v5
        with:
          # Branch tip, not the trigger commit: a queued run starts hours
          # late, and replaying its data commit from the old base reverted
          # manual edits made in between and rebuilt the site without them.
          ref: ${{ github.ref }}

      - name: Enable GitHub Pages (build_type=workflow)
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - name: Test public commit summary privacy
        run: python tests/test_changelog.py

      - name: Test mandatory airport IATA codes
        run: |
          python tests/test_airport_codes.py
          python tests/test_airport_source_codes.py

      - name: Test news freshness invariants
        run: |
          python tests/test_news_freshness.py
          python tests/test_news_retry.py
          python tests/test_news_chronology.py

      - name: Test editorial routing and industry roundup
        run: |
          python tests/test_editorial_policy.py
          python tests/test_industry_roundup.py

      - name: Test concurrent-write guards
        run: python -m pytest -q tests/test_data_merge.py

      - name: Test provider cooldown persistence
        run: python tests/test_provider_health.py

      - name: Test summary boundary guard
        run: |
          python tests/test_summary_guard.py
          python -m pytest -q tests/test_summary_display.py

      - name: Test source enrichment and flightwatch resilience
        run: |
          python tests/test_companion.py
          python tests/test_flightwatch.py
          python tests/test_source_links.py

      - name: Test headline priority and subject scope
        run: python tests/test_headline_rotation.py

      - name: Test image relevance and fallback guards
        run: |
          python tests/test_image_selection.py
          python -m pytest -q tests/test_terra_images.py
          python tests/test_images.py
          python tests/test_image_fallbacks.py
          python tests/test_volcano_images.py
          python tests/test_image_qa.py

      - name: Refresh shared paid API budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: python pipeline/paid_budget_sync.py refresh

      - name: Run pipeline
        env:
          AVWIRE_PAID_BUDGET_ENABLED: "true"
          GH_TOKEN: ${{ github.token }}
          AVWIRE_LUNA_EDITORIAL: "true"
          AVWIRE_FREE_FIRST: "true"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API }}
          NEWS_WEB_SEARCH: "true"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # one NIM key serves every model on the platform; the long name is
          # the secret the owner created for it
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || secrets.API_1_NVIDIA_NEMOTRON_3_ULTRA_550B_A55B }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          WECHAT_API_KEY: ${{ secrets.DeepSeekV4Flash_API }}
          AEROAPI_KEY: ${{ secrets.AEROAPI_KEY }} # optional
          ADSBLOL_API_KEY: ${{ secrets.ADSBLOL_API_KEY }} # optional
          # optional repo variables
          AVWIRE_MODEL: ${{ vars.AVWIRE_MODEL }}
          AVWIRE_OPENAI_MODEL: ${{ vars.AVWIRE_OPENAI_MODEL }}
          AVWIRE_GEMINI_MODEL: ${{ vars.AVWIRE_GEMINI_MODEL }}
          AVWIRE_NVIDIA_MODEL: ${{ vars.AVWIRE_NVIDIA_MODEL }}
          AVWIRE_WECHAT_MODEL: ${{ vars.AVWIRE_WECHAT_MODEL }}
          # freshness window (hours); code default 120, validated 24-336
          NEWS_MAX_AGE_HOURS: ${{ vars.NEWS_MAX_AGE_HOURS }}
          PYTHONUNBUFFERED: '1'
          # private usage-dashboard URL token (page skipped when unset)
          AVWIRE_USAGE_TOKEN: ${{ secrets.AVWIRE_USAGE_TOKEN }}
          # private manual-drafting URL/encryption token
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          AVWIRE_MANUAL_TOKEN: ${{ secrets.AVWIRE_MANUAL_TOKEN }}
          # private Copilot panel; build-time visibility is not authorization
          SKYTICAL_COPILOT_ENABLED: ${{ vars.SKYTICAL_COPILOT_ENABLED || 'false' }}
          SKYTICAL_GA4_MEASUREMENT_ID: ${{ vars.SKYTICAL_GA4_MEASUREMENT_ID }}
          SKYTICAL_TRAFFIC_APP_URL: ${{ vars.SKYTICAL_TRAFFIC_APP_URL }}
          # bulletin-only briefing pages by default; build.py applies the
          # same gate at render time, so hourly rebuilds need the var too
          BRIEFING_INCLUDE_ARTICLES: ${{ vars.BRIEFING_INCLUDE_ARTICLES }}
        run: |
          python pipeline/fetch.py
          python pipeline/news_search.py
          python pipeline/dedupe.py
          python pipeline/write.py
          python pipeline/summary_guard.py
          python pipeline/airport_codes.py
          python pipeline/image_captions.py
          python pipeline/images.py
          # Terra-assisted image selection is temporarily paused at Kass's request.
          # Existing images and the other automatic image stages remain enabled.
          python pipeline/image_fallbacks.py
          python tests/test_image_captions.py
          python pipeline/image_qa.py
          # The saved Taipei date makes this one LLM-assisted refresh per day.
          # Missing/invalid model output falls back to published article titles.
          python pipeline/search_prompts.py --daily-if-due
          # Manual edits, briefings and code may have landed on the branch
          # while this run was drafting; deploys race (last wins). Replay this
          # run's data on the tip before building so the deploy keeps them.
          # Nothing is pushed until the audits below pass.
          # Persist the ledger first: the branch still holds this run's last
          # reservation, and the rebase would merge it back in as unsettled.
          python pipeline/paid_budget_sync.py persist
          git config user.name "skytical-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -q -m "hourly update $(date -u +%FT%H:%M)"
          fi
          # Articles, flashes and incidents merge by article through
          # data_merge.py (.gitattributes); -X theirs settles only the
          # bot-owned caches and ledgers.
          python pipeline/data_merge.py install
          replayed=""
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"; then
              replayed=yes
              break
            fi
            git rebase --abort || true
            sleep 5
          done
          if [ -z "$replayed" ]; then
            # Building from the run-start snapshot would deploy a site
            # without the edits merged since, so stop before the build.
            echo "::error::this run's data could not be replayed on ${GITHUB_REF_NAME}; nothing is built, deployed or pushed"
            exit 1
          fi
          # Locked photos and articles on the tip outrank this run's copy.
          python pipeline/data_merge.py guard "origin/${GITHUB_REF_NAME}"
          python pipeline/build.py
          python pipeline/radar_snapshot.py --optional

      - name: Save paid API budget recovery snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paid-budget-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/paid-budget.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Persist paid API budget even after failure
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python pipeline/paid_budget_sync.py persist

      # Audit the pipeline output after images.py has had a chance to remove
      # stale or misleading cached photos. This still fails closed before any
      # artifact is uploaded or generated data is committed.
      - name: Audit generated image relevance
        run: python tests/test_recent_image_quality.py

      - name: Scan build output and committed data for secrets/reasoning
        run: |
          scan() {
            set +e
            matches=$(grep -rIHnEo "$1" site/ data/ | awk -F: '
              {
                path = $1
                value = $3
                archive = path ~ /^site\/commit-records\// \
                       || path ~ /^site\/changelog\/commits\// \
                       || path ~ /^site\/[a-z][a-z]\/changelog\/commits\//
                fixture = value == "nvapi-TESTFAKEKEY1234567890" \
                       || value == "oc_sk_test-not-a-real-key" \
                       || value == "Bearer test-openai-key-not-real" \
                       || value == "reasoning_content" \
                       || value == "<think>"
                if (archive && fixture) next
                print
              }')
            rc=$?
            set -e
            if [ "$rc" -ge 2 ]; then
              echo "::error::scan failed (grep rc=$rc)"
              exit 1
            elif [ -n "$matches" ]; then
              printf '%s\n' "$matches"
              echo "::error::$2 found in publishable output"
              exit 1
            fi
          }
          scan "nvapi-[A-Za-z0-9_-]{16,}|AIza[0-9A-Za-z_-]{20,}|sk-ant-[A-Za-z0-9_-]{16,}|sk-or-v1-[A-Za-z0-9_-]{16,}|oc_sk_[A-Za-z0-9_-]{16,}|gsk_[A-Za-z0-9_-]{16,}|Bearer [A-Za-z0-9_./+-]{20,}" "secret-like string"
          scan "reasoning_content|<think>" "reasoning trace"
          echo "scan: site/ and data/ clean"

      # Upload BEFORE the data commit so the deploy never depends on git push.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          # Preserve v3 packaging, including .nojekyll and other site dotfiles.
          include-hidden-files: true

      - name: Commit data
        continue-on-error: true # a push race must not fail the run or block deploy
        run: |
          git config user.name "skytical-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "hourly update $(date -u +%FT%H:%M)"
          fi
          pushed=""
          python pipeline/data_merge.py install
          for i in 1 2 3; do
            # -X theirs: the run's version of bot-owned caches and ledgers is
            # kept; published data merges by article (data_merge.py)
            if ! git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              sleep 5
              continue
            fi
            python pipeline/data_merge.py guard "origin/${GITHUB_REF_NAME}"
            git add data
            if ! git diff --cached --quiet; then
              git commit -q -m "keep protected edits $(date -u +%FT%H:%M)"
            fi
            if [ -z "$(git rev-list -n 1 "origin/${GITHUB_REF_NAME}..HEAD")" ]; then
              echo "no changes to commit"
              exit 0
            fi
            if git push; then
              pushed=yes
              break
            fi
            sleep 5
          done
          if [ -z "$pushed" ]; then
            echo "::warning::data commit could not be pushed after 3 attempts"
            exit 1
          fi

  deploy:
    needs: update
    runs-on: ubuntu-latest
    concurrency:
      group: skytical-pages-publish
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment

