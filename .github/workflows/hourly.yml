name: hourly-update

on:
  schedule:
    - cron: "0 * * * *" # every hour on the hour (UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**" # bot data commits must not retrigger the workflow

concurrency:
  group: hourly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits data/ back to the repo
      pages: write # configure-pages enablement
    steps:
      - uses: actions/checkout@v4

      - name: Enable GitHub Pages (build_type=workflow)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # one NIM key serves every model on the platform; the long name is
          # the secret the owner created for it
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || secrets.API_1_NVIDIA_NEMOTRON_3_ULTRA_550B_A55B }}
          AEROAPI_KEY: ${{ secrets.AEROAPI_KEY }} # optional
          # optional repo variables
          AVWIRE_MODEL: ${{ vars.AVWIRE_MODEL }}
          AVWIRE_GEMINI_MODEL: ${{ vars.AVWIRE_GEMINI_MODEL }}
          AVWIRE_NVIDIA_MODEL: ${{ vars.AVWIRE_NVIDIA_MODEL }}
          AVWIRE_PROVIDER_ORDER: ${{ vars.AVWIRE_PROVIDER_ORDER }}
          # freshness window (hours); code default 120, validated 24-336
          NEWS_MAX_AGE_HOURS: ${{ vars.NEWS_MAX_AGE_HOURS }}
          # private usage-dashboard URL token (page skipped when unset)
          AVWIRE_USAGE_TOKEN: ${{ secrets.AVWIRE_USAGE_TOKEN }}
          # rare-aircraft auto-publish kill switch (code default: on)
          FLIGHT_AUTO_PUBLISH: ${{ vars.FLIGHT_AUTO_PUBLISH }}
          # bulletin-only briefing pages by default; build.py applies the
          # same gate at render time, so hourly rebuilds need the var too
          BRIEFING_INCLUDE_ARTICLES: ${{ vars.BRIEFING_INCLUDE_ARTICLES }}
        run: |
          python pipeline/fetch.py
          python pipeline/dedupe.py
          python pipeline/write.py
          python pipeline/images.py
          python pipeline/build.py

      - name: Scan build output and committed data for secrets/reasoning
        run: |
          scan() {
            set +e
            grep -rInE "$1" site/ data/
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "::error::$2 found in publishable output"
              exit 1
            elif [ "$rc" -ge 2 ]; then
              echo "::error::scan failed (grep rc=$rc)"  # fail closed
              exit 1
            fi
          }
          scan "nvapi-[A-Za-z0-9_-]{16,}|AIza[0-9A-Za-z_-]{20,}|sk-ant-[A-Za-z0-9_-]{16,}|Bearer [A-Za-z0-9_./+-]{20,}" "secret-like string"
          scan "reasoning_content|<think>" "reasoning trace"
          echo "scan: site/ and data/ clean"

      # Upload BEFORE the data commit so the deploy never depends on git push.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Commit data
        continue-on-error: true # a push race must not fail the run or block deploy
        run: |
          git config user.name "avwire-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "hourly update $(date -u +%FT%H:%M)"
          pushed=""
          for i in 1 2 3; do
            # -X theirs keeps the bot's replayed commit (data/ is bot-owned)
            if ! git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              sleep 5
              continue
            fi
            if git push; then
              pushed=yes
              break
            fi
            sleep 5
          done
          if [ -z "$pushed" ]; then
            echo "::warning::data commit could not be pushed after 3 attempts"
            exit 1
          fi

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
