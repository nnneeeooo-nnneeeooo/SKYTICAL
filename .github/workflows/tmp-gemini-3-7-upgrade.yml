name: tmp-gemini-3-7-upgrade

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.head_ref == 'agent/gemini-3-7-flash'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Apply Gemini 3.7 primary and 3.6 fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'expected block not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'pipeline/model_config.py',
              '''DIRECT_MODEL_ORDER = (\n    "gemini:gemini-3.6-flash",\n    "gemini:gemini-3.5-flash",\n    "nvidia:z-ai/glm-5.2",\n    "nvidia:deepseek-ai/deepseek-v4-pro",\n    "nvidia:nvidia/nemotron-3-ultra-550b-a55b",\n    "nvidia:qwen/qwen3.5-397b-a17b",\n    "nvidia:nvidia/nemotron-3-super-120b-a12b",\n    "nvidia:mistralai/mistral-medium-3.5-128b",\n)''',
              '''DIRECT_MODEL_ORDER = (\n    "gemini:gemini-3.7-flash",\n    "gemini:gemini-3.6-flash",\n    "gemini:gemini-3.5-flash",\n    "nvidia:z-ai/glm-5.2",\n    "nvidia:deepseek-ai/deepseek-v4-pro",\n    "nvidia:nvidia/nemotron-3-ultra-550b-a55b",\n    "nvidia:qwen/qwen3.5-397b-a17b",\n    "nvidia:nvidia/nemotron-3-super-120b-a12b",\n    "nvidia:mistralai/mistral-medium-3.5-128b",\n)''')

          replace_once(
              'pipeline/model_config.py',
              '''MODEL_ORDER = (\n    OPENCODE_MODEL_ORDER[0],\n    OPENCODE_MODEL_ORDER[1],\n    DIRECT_MODEL_ORDER[0],\n    OPENCODE_MODEL_ORDER[2],\n    OPENCODE_MODEL_ORDER[3],\n    DIRECT_MODEL_ORDER[2],\n    OPENCODE_MODEL_ORDER[4],\n    OPENCODE_MODEL_ORDER[5],\n    DIRECT_MODEL_ORDER[1],\n    *DIRECT_MODEL_ORDER[3:5],\n    OPENROUTER_MODEL_ORDER[0],\n    *DIRECT_MODEL_ORDER[5:7],\n    OPENROUTER_MODEL_ORDER[1],\n    DIRECT_MODEL_ORDER[7],\n    *OPENROUTER_MODEL_ORDER[2:],\n)''',
              '''MODEL_ORDER = (\n    OPENCODE_MODEL_ORDER[0],\n    OPENCODE_MODEL_ORDER[1],\n    DIRECT_MODEL_ORDER[0],\n    DIRECT_MODEL_ORDER[1],\n    OPENCODE_MODEL_ORDER[2],\n    OPENCODE_MODEL_ORDER[3],\n    DIRECT_MODEL_ORDER[3],\n    OPENCODE_MODEL_ORDER[4],\n    OPENCODE_MODEL_ORDER[5],\n    DIRECT_MODEL_ORDER[2],\n    *DIRECT_MODEL_ORDER[4:6],\n    OPENROUTER_MODEL_ORDER[0],\n    *DIRECT_MODEL_ORDER[6:8],\n    OPENROUTER_MODEL_ORDER[1],\n    DIRECT_MODEL_ORDER[8],\n    *OPENROUTER_MODEL_ORDER[2:],\n)''')

          replace_once(
              'pipeline/model_config.py',
              '    "gemini:gemini-3.6-flash": "Google Gemini 3.6 Flash",',
              '    "gemini:gemini-3.7-flash": "Google Gemini 3.7 Flash",\n    "gemini:gemini-3.6-flash": "Google Gemini 3.6 Flash",')

          replace_once(
              'pipeline/providers.py',
              'GEMINI_DEFAULT_MODEL = "gemini-3.6-flash"',
              'GEMINI_DEFAULT_MODEL = "gemini-3.7-flash"')

          replace_once(
              'pipeline/providers.py',
              '''    "gemini-3.6-flash": {\n        "generationConfig": {"maxOutputTokens": 16384,\n                             "thinkingConfig": {"thinkingLevel": "high"}},\n        "repairGenerationConfig": {\n            "maxOutputTokens": 8192,\n            "thinkingConfig": {"thinkingLevel": "minimal"}},\n    },''',
              '''    "gemini-3.7-flash": {\n        "generationConfig": {"maxOutputTokens": 16384,\n                             "thinkingConfig": {"thinkingLevel": "high"}},\n        "repairGenerationConfig": {\n            "maxOutputTokens": 8192,\n            "thinkingConfig": {"thinkingLevel": "minimal"}},\n    },\n    "gemini-3.6-flash": {\n        "generationConfig": {"maxOutputTokens": 16384,\n                             "thinkingConfig": {"thinkingLevel": "high"}},\n        "repairGenerationConfig": {\n            "maxOutputTokens": 8192,\n            "thinkingConfig": {"thinkingLevel": "minimal"}},\n    },''')

          p = Path('tests/test_providers_payloads.py')
          text = p.read_text(encoding='utf-8')
          replacements = [
              ('        "gemini:gemini-3.6-flash",\n        "opencode:gemini-3.1-pro",',
               '        "gemini:gemini-3.7-flash",\n        "gemini:gemini-3.6-flash",\n        "opencode:gemini-3.1-pro",'),
              ('check(providers.GEMINI_DEFAULT_MODEL == "gemini-3.6-flash",\n          "Gemini 3.6 Flash is the default model")',
               'check(providers.GEMINI_DEFAULT_MODEL == "gemini-3.7-flash",\n          "Gemini 3.7 Flash is the default model")'),
              ('check(expected[10:12] == (', 'check(expected[11:13] == ('),
              (') and expected[13:15] == (', ') and expected[14:16] == ('),
              ('"""Gemini 3.6/3.5 send thinkingLevel high; unknown models send none."""',
               '"""Gemini 3.7/3.6/3.5 send thinkingLevel high; unknown models send none."""'),
              ('for model in ("gemini-3.6-flash", "gemini-3.5-flash"):',
               'for model in ("gemini-3.7-flash", "gemini-3.6-flash", "gemini-3.5-flash"):'),
              ('provider = providers.GeminiProvider("gemini-3.6-flash")',
               'provider = providers.GeminiProvider("gemini-3.7-flash")'),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'expected test block not found: {old[:60]!r}')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Run provider payload tests
        run: python tests/test_providers_payloads.py

      - name: Commit tested changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pipeline/model_config.py pipeline/providers.py tests/test_providers_payloads.py
          if git diff --cached --quiet; then
            echo 'No model changes to commit.'
          else
            git commit -m 'feat: upgrade Gemini Flash to 3.7'
            git push origin HEAD:${{ github.head_ref }}
          fi
