name: private-manual-draft

on:
  push:
    branches: [main]
    paths:
      - "data/manual-jobs/inbox/*.json"
  workflow_dispatch:

concurrency:
  group: private-manual-draft
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Process encrypted drafting jobs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || secrets.API_1_NVIDIA_NEMOTRON_3_ULTRA_550B_A55B }}
          AVWIRE_MANUAL_TOKEN: ${{ secrets.AVWIRE_MANUAL_TOKEN }}
        run: python pipeline/manual_draft.py --process-pending

      - name: Verify that only encrypted envelopes enter the job store
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          allowed = {"version", "alg", "iv", "ciphertext"}
          for path in Path("data/manual-jobs").glob("*/*.json"):
              row = json.loads(path.read_text(encoding="utf-8"))
              if set(row) != allowed or row.get("version") != 1 or row.get("alg") != "A256GCM":
                  raise SystemExit(f"unencrypted/invalid manual job: {path}")
          print("manual jobs: encrypted envelopes only")
          PY

      - name: Commit encrypted results and usage totals
        run: |
          git config user.name "avwire-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/manual-jobs/outbox 2>/dev/null || true
          git add data/usage.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no pending jobs"
            exit 0
          fi
          git commit -m "complete encrypted manual draft $(date -u +%FT%H:%M)"
          pushed=""
          for i in 1 2 3; do
            if ! git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              sleep 5
              continue
            fi
            if git push; then
              pushed=yes
              break
            fi
            sleep 5
          done
          if [ -z "$pushed" ]; then
            echo "::error::encrypted result could not be pushed after 3 attempts"
            exit 1
          fi
