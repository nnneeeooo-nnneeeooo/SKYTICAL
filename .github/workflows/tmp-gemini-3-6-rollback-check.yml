name: tmp-gemini-3-6-rollback-check

on:
  push:
    branches:
      - fix/gemini-3-6-stable

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run focused provider payload tests
        run: python tests/test_providers_payloads.py
      - name: Verify workflow provider order
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          sys.path.insert(0, "pipeline")
          from model_config import DEFAULT_PROVIDER_ORDER

          assert "gemini-3.7-flash" not in DEFAULT_PROVIDER_ORDER
          assert DEFAULT_PROVIDER_ORDER.split(",")[2] == "gemini:gemini-3.6-flash"
          for path in (".github/workflows/hourly.yml", ".github/workflows/briefing.yml"):
              text = Path(path).read_text(encoding="utf-8")
              line = next(line for line in text.splitlines() if "AVWIRE_PROVIDER_ORDER:" in line)
              actual = line.split("AVWIRE_PROVIDER_ORDER:", 1)[1].strip()
              assert actual == DEFAULT_PROVIDER_ORDER, f"{path}: workflow order diverges"
          print("Gemini 3.6 rollback order verified")
          PY
