name: briefing-and-env-migration-tests

on:
  push:
    paths:
      - ".github/workflows/briefing-migration-tests.yml"
      - "tests/test_briefing.py"
      - "tests/_briefing_legacy.py"
      - "pipeline/**"
      - ".github/workflows/**"
      - ".env.example"
      - "README.md"
      - "handoff.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/briefing-migration-tests.yml"
      - "tests/test_briefing.py"
      - "tests/_briefing_legacy.py"
      - "pipeline/**"
      - ".github/workflows/**"
      - ".env.example"
      - "README.md"
      - "handoff.md"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - name: Compile pipeline and tests
        run: python -m compileall -q pipeline tests
      - name: Run standalone briefing checks
        run: python tests/test_briefing.py
      - name: Verify pytest collection and isolation
        run: python -m pytest -q tests/test_briefing.py
      - name: Verify production output is unchanged
        if: always()
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- data site)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            echo "::error::Briefing tests modified production output"
            exit 1
          fi
