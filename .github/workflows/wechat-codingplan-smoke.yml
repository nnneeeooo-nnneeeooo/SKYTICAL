name: wechat-codingplan-smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/wechat-codingplan-smoke.yml

permissions:
  contents: read

concurrency:
  group: wechat-codingplan-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WECHAT_CODINGPLAN_TOKEN: ${{ secrets.DeepSeekV4Flash_API }}
    steps:
      - name: Verify WeChat Coding Plan DeepSeek V4 Flash API
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${WECHAT_CODINGPLAN_TOKEN:-}" ]; then
            echo "::error::Repository secret DeepSeekV4Flash_API is missing or empty."
            exit 1
          fi

          request_file="${RUNNER_TEMP}/wechat-codingplan-request.json"
          response_file="${RUNNER_TEMP}/wechat-codingplan-response.json"
          printf '%s' '{"model":"Deepseek-v4-flash","messages":[{"role":"user","content":"Reply with one short confirmation token."}],"thinking":{"type":"disabled"},"max_tokens":16,"stream":false}' > "${request_file}"

          http_status="$(
            curl --silent --show-error \
              --output "${response_file}" \
              --write-out "%{http_code}" \
              --connect-timeout 10 \
              --max-time 120 \
              --header "Content-Type: application/json" \
              --header "Authorization: Bearer ${WECHAT_CODINGPLAN_TOKEN}" \
              --data-binary "@${request_file}" \
              https://chatapi.weixin.qq.com/openai/v1/chat/completions
          )"

          if [ "${http_status}" != "200" ]; then
            python3 - "${response_file}" "${http_status}" <<'PY'
          import json
          import sys

          path, status = sys.argv[1:]
          try:
              payload = json.load(open(path, encoding="utf-8"))
          except Exception:
              payload = {}
          error = payload.get("error") if isinstance(payload, dict) else {}
          error = error if isinstance(error, dict) else {}
          error_type = str(error.get("type") or "unknown")[:80]
          error_code = str(error.get("code") or error.get("error_code") or "unknown")[:80]
          print(
              f"::error::WeChat Coding Plan request failed: "
              f"HTTP {status}, type={error_type}, code={error_code}"
          )
          PY
            exit 1
          fi

          python3 - "${response_file}" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          choices = payload.get("choices") or []
          first = choices[0] if choices and isinstance(choices[0], dict) else {}
          message = first.get("message") if isinstance(first, dict) else {}
          message = message if isinstance(message, dict) else {}
          content = message.get("content")
          if not isinstance(content, str) or not content.strip():
              print("::error::WeChat Coding Plan returned HTTP 200 without assistant content.")
              raise SystemExit(1)

          usage = payload.get("usage") if isinstance(payload, dict) else {}
          usage = usage if isinstance(usage, dict) else {}
          model = str(payload.get("model") or "unknown")[:80]
          finish_reason = str(first.get("finish_reason") or "unknown")[:40]
          total_tokens = usage.get("total_tokens", "unknown")
          print(
              "WeChat Coding Plan DeepSeek V4 Flash call succeeded: "
              f"model={model}, finish_reason={finish_reason}, "
              f"total_tokens={total_tokens}."
          )
          PY

