name: source-recovery-replay
on:
  workflow_dispatch:
concurrency:
  group: skytical-paid-api-${{ github.ref }}
  queue: max
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh publication data and paid ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          # A queued dispatch may predate the hourly data commit. Start from
          # that commit so its article/queue changes are not replayed as ours.
          git checkout -B source-recovery-runtime origin/main
          python pipeline/paid_budget_sync.py refresh
      - name: Recover the five missed stories with Luna search
        env:
          AVWIRE_PROVIDER_ORDER: openai:gpt-6-luna
          AVWIRE_OPENAI_MODEL: gpt-6-luna
          AVWIRE_PAID_BUDGET_ENABLED: 'true'
          AVWIRE_LUNA_EDITORIAL: 'true'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API }}
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: python pipeline/replay_source_recovery.py
      - name: Save recovery results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'news: recover thin-source stories with Luna search'
            pushed=""
            python pipeline/data_merge.py install
            for i in 1 2 3; do
              # Match hourly.yml: paid-ledger CAS commits can advance main
              # during drafting; prefer the completed replay's bot-owned data.
              # Published data merges by article (data_merge.py).
              if ! git pull --rebase -X theirs origin main; then
                git rebase --abort || true
                sleep 5
                continue
              fi
              python pipeline/data_merge.py guard origin/main
              git add data
              git diff --cached --quiet || git commit -q -m 'news: keep protected edits'
              if git push origin HEAD:main; then
                pushed=yes
                break
              fi
              sleep 5
            done
            test -n "$pushed"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-recovery-results
          path: |
            data/source-recovery.json
            data/source-replay-report.json
            data/pending.json
          retention-days: 7
      - name: Persist paid ledger
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python pipeline/paid_budget_sync.py persist
      - name: Publish committed recovery results
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run manual-article-deploy.yml --ref main
