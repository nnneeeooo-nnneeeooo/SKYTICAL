name: unblock-changelog-deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/unblock-changelog.yml"]

# A one-time operational recovery outside the Pages publishing queue.
# Only identified obsolete runs and this recovery's redundant hourly runs
# may be cancelled; manual-article-deploy is always left intact.
permissions:
  actions: write

jobs:
  unblock:
    if: github.repository == 'nnneeeooo-nnneeeooo/SKYTICAL'
    runs-on: ubuntu-latest
    steps:
      - name: Release the pending changelog deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = "https://api.github.com/repos/nnneeeooo-nnneeeooo/SKYTICAL/actions/runs/"
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28"}
          targets = {
              36824059337: "f5fee491e63a54bd7cf0e5c33e92ba1b86eb0c0e",
              36824802705: "2fded0e9f2f4e329e5013e515b822d97ec274a21",
          }
          for run_id, expected_sha in targets.items():
              url = base + str(run_id)
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  run = json.load(response)
              if run["head_sha"] != expected_sha:
                  raise RuntimeError("Unexpected commit for run " + str(run_id))
              if run["status"] == "completed":
                  print("Already completed:", run_id)
                  continue
              request = urllib.request.Request(url + "/cancel", data=b"",
                                               headers=headers, method="POST")
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      print("Cancellation requested:", run_id, response.status)
              except urllib.error.HTTPError as error:
                  if error.code != 409:
                      raise
                  print("Run no longer cancellable:", run_id)

          # Code pushes also launch hourly drafting. Cancel this operation's
          # redundant hourly runs so the already queued direct deploy can run.
          allowed = {
              "a53a253655eb365d6ddbb25525634004aeee28d8",
              "43eae50aabde52efb5ba194e0f4d49fa6e30cf28",
              os.environ["RECOVERY_SHA"],
          }
          for status in ("in_progress", "pending", "queued"):
              url = base.rstrip("/") + "?per_page=100&status=" + status
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  runs = json.load(response)["workflow_runs"]
              for run in runs:
                  if (run["name"] != "hourly-update"
                          or run["head_branch"] != "main"
                          or run["event"] != "push"
                          or run["head_sha"] not in allowed):
                      continue
                  request = urllib.request.Request(
                      base + str(run["id"]) + "/cancel", data=b"",
                      headers=headers, method="POST")
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          print("Redundant hourly cancellation:", run["id"], response.status)
                  except urllib.error.HTTPError as error:
                      if error.code != 409:
                          raise
                      print("Hourly run already finished:", run["id"])
          PY
