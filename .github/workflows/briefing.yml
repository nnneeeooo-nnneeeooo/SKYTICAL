name: daily-briefing

# Three daily aviation briefings (Asia/Taipei editions).
# UTC crons map to fixed Taipei editions — the mapping below must match
# CRON_TO_EDITION in pipeline/briefing.py (tests cross-check both):
#   15 23 * * *  ->  morning    (07:15 Taipei)
#   15 7  * * *  ->  afternoon  (15:15 Taipei)
#   15 15 * * *  ->  evening    (23:15 Taipei)
# A delayed run never changes the data window: the window is derived from
# the edition + Taipei date only (see pipeline/briefing.py).

on:
  schedule:
    - cron: "15 23 * * *"
    - cron: "15 7 * * *"
    - cron: "15 15 * * *"
    - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      edition:
        description: "Briefing edition"
        required: true
        type: choice
        options:
          - morning
          - afternoon
          - evening
      date:
        description: "Taipei date YYYY-MM-DD (default: today in Taipei)"
        required: false
        type: string

jobs:
  briefing:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.run_briefing.outputs.publish }}
      failed: ${{ steps.run_briefing.outputs.failed }}
      persisted: ${{ steps.persist.outputs.persisted }}
      artifact: ${{ steps.upload.outputs.artifact_id }}
    concurrency:
      group: skytical-briefing-pipeline
      cancel-in-progress: false
    permissions:
      contents: write # commits data/briefings back to the repo
      pages: write # configure-pages enablement
    steps:
      - uses: actions/checkout@v5

      - name: Refresh to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Enable GitHub Pages (build_type=workflow)
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Test aviation briefing contracts
        run: |
          python tests/test_grounded.py
          python tests/test_briefing.py
          python tests/test_briefing_writer.py
          python tests/test_briefing_ui.py
          python tests/test_briefing_recovery.py

      - name: Resolve briefing run mode
        id: ed
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_EDITION: ${{ inputs.edition }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "mode=normal" >> "$GITHUB_OUTPUT"
            echo "edition=$INPUT_EDITION" >> "$GITHUB_OUTPUT"
            echo "date=$INPUT_DATE" >> "$GITHUB_OUTPUT"
          else
            case "$SCHEDULE" in
              "15 23 * * *") echo "edition=morning" >> "$GITHUB_OUTPUT" ;;
              "15 7 * * *")  echo "edition=afternoon" >> "$GITHUB_OUTPUT" ;;
              "15 15 * * *") echo "edition=evening" >> "$GITHUB_OUTPUT" ;;
              "5,35 * * * *") echo "mode=recover" >> "$GITHUB_OUTPUT" ;;
              *) echo "::error::unmapped schedule '$SCHEDULE'"; exit 1 ;;
            esac
            if [ "$SCHEDULE" != "5,35 * * * *" ]; then
              echo "mode=normal" >> "$GITHUB_OUTPUT"
              echo "date=" >> "$GITHUB_OUTPUT"
              echo "cron=$SCHEDULE" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run briefing with persisted-state guard
        id: run_briefing
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || secrets.API_1_NVIDIA_NEMOTRON_3_ULTRA_550B_A55B }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          WECHAT_API_KEY: ${{ secrets.DeepSeekV4Flash_API }}
          ADSBLOL_API_KEY: ${{ secrets.ADSBLOL_API_KEY }} # optional
          AVWIRE_WECHAT_MODEL: ${{ vars.AVWIRE_WECHAT_MODEL }}
          AVWIRE_OPENAI_MODEL: ${{ vars.AVWIRE_OPENAI_MODEL }}
          AVWIRE_PROVIDER_ORDER: gemini:gemini-3.6-flash,gemini:gemini-3.5-flash,nvidia:nvidia/nemotron-3-ultra-550b-a55b,wechat:Deepseek-v4-flash,openrouter:nvidia/nemotron-3-ultra-550b-a55b:free,nvidia:nvidia/nemotron-3-super-120b-a12b,openai:gpt-6-luna
          BRIEFING_WRITER: "true"
          BRIEFING_WRITER_MODEL: gpt-6-luna
          BRIEFING_WRITER_EFFORT: medium
          BRIEFING_WRITER_CALLS_MAX: '2'
          BRIEFING_GROUNDED: "true"
          BRIEFING_GROUNDED_PROVIDER: openai
          BRIEFING_GROUNDED_MODEL: gpt-6-luna
          BRIEFING_GROUNDED_EFFORT: medium
          BRIEFING_LLM_INTRO: "false"
          BRIEFING_MAX_ITEMS: ${{ vars.BRIEFING_MAX_ITEMS }}
          BRIEFING_MAX_ITEMS_PER_SECTION: ${{ vars.BRIEFING_MAX_ITEMS_PER_SECTION }}
          # private usage-dashboard URL token (page skipped when unset)
          AVWIRE_USAGE_TOKEN: ${{ secrets.AVWIRE_USAGE_TOKEN }}
          # private manual-drafting URL/encryption token
          AVWIRE_MANUAL_TOKEN: ${{ secrets.AVWIRE_MANUAL_TOKEN }}
          SKYTICAL_COPILOT_ENABLED: ${{ vars.SKYTICAL_COPILOT_ENABLED || 'false' }}
          BRIEFING_INCLUDE_ARTICLES: ${{ vars.BRIEFING_INCLUDE_ARTICLES }}
          RUN_MODE: ${{ steps.ed.outputs.mode }}
          EDITION: ${{ steps.ed.outputs.edition }}
          REPORT_DATE: ${{ steps.ed.outputs.date }}
          SCHEDULE_CRON: ${{ steps.ed.outputs.cron }}
        run: |
          python tests/test_headline_rotation.py
          if [ "$RUN_MODE" = "recover" ]; then
            python pipeline/briefing_recovery.py --recover
          elif [ -n "$REPORT_DATE" ]; then
            python pipeline/briefing_recovery.py --edition "$EDITION" --date "$REPORT_DATE"
          elif [ -n "$SCHEDULE_CRON" ]; then
            python pipeline/briefing_recovery.py --edition "$EDITION" --cron "$SCHEDULE_CRON"
          else
            python pipeline/briefing_recovery.py --edition "$EDITION"
          fi

      - name: Build site when briefing data changed
        if: steps.run_briefing.outputs.publish == 'true'
        env:
          ADSBLOL_API_KEY: ${{ secrets.ADSBLOL_API_KEY }} # optional radar snapshot
          AVWIRE_USAGE_TOKEN: ${{ secrets.AVWIRE_USAGE_TOKEN }}
          AVWIRE_MANUAL_TOKEN: ${{ secrets.AVWIRE_MANUAL_TOKEN }}
          SKYTICAL_COPILOT_ENABLED: ${{ vars.SKYTICAL_COPILOT_ENABLED || 'false' }}
        run: |
          python pipeline/build.py
          python pipeline/radar_snapshot.py --optional

      - name: Scan build output and committed data for secrets/reasoning
        if: steps.run_briefing.outputs.publish == 'true'
        run: |
          scan() {
            set +e
            grep -rInE "$1" site/ data/
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "::error::$2 found in publishable output"
              exit 1
            elif [ "$rc" -ge 2 ]; then
              echo "::error::scan failed (grep rc=$rc)"  # fail closed
              exit 1
            fi
          }
          scan "nvapi-[A-Za-z0-9_-]{16,}|AIza[0-9A-Za-z_-]{20,}|sk-ant-[A-Za-z0-9_-]{16,}|sk-or-v1-[A-Za-z0-9_-]{16,}|oc_sk_[A-Za-z0-9_-]{16,}|Bearer [A-Za-z0-9_./+-]{20,}" "secret-like string"
          scan "reasoning_content|<think>" "reasoning trace"
          echo "scan: site/ and data/ clean"

      # Upload BEFORE the data commit so the deploy never depends on git push.
      - uses: actions/upload-pages-artifact@v5
        id: upload
        if: steps.run_briefing.outputs.publish == 'true'
        with:
          path: site
          # Preserve v3 packaging, including .nojekyll and other site dotfiles.
          include-hidden-files: true

      - name: Commit briefing data (only when changed)
        id: persist
        if: steps.run_briefing.outputs.publish == 'true'
        run: |
          git config user.name "skytical-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/briefings
          git add data/usage.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes to commit; current main already contains the state"
            echo "persisted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "briefing ${{ steps.ed.outputs.edition }} $(date -u +%FT%H:%M)"
          pushed=""
          for i in 1 2 3; do
            if ! git pull --rebase -X theirs origin main; then
              git rebase --abort || true
              sleep 5
              continue
            fi
            if git push origin HEAD:main; then
              pushed=yes
              break
            fi
            sleep 5
          done
          if [ -z "$pushed" ]; then
            echo "::error::briefing data could not be persisted after 3 attempts"
            exit 1
          fi
          echo "persisted=true" >> "$GITHUB_OUTPUT"

      - name: Fail run if an edition failed validation
        if: steps.run_briefing.outcome == 'failure' || steps.run_briefing.outputs.failed == 'true'
        run: |
          echo "::error::one or more briefing editions failed; inspect per-edition logs"
          exit 1

  deploy:
    needs: briefing
    if: always() && needs.briefing.outputs.publish == 'true' && needs.briefing.outputs.persisted == 'true' && needs.briefing.outputs.artifact != ''
    runs-on: ubuntu-latest
    concurrency:
      group: skytical-pages-publish
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
