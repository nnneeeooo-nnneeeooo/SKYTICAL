name: luna-token-retry
on:
  workflow_dispatch:
concurrency:
  group: skytical-paid-api-${{ github.ref }}
  queue: max
  cancel-in-progress: false
jobs:
  retry:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh current data and paid ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git checkout origin/main -- data
          python pipeline/paid_budget_sync.py refresh
      - name: Retry six token-limited stories with Luna MAX
        env:
          AVWIRE_PAID_BUDGET_ENABLED: 'true'
          AVWIRE_PROVIDER_ORDER: openai:gpt-6
          AVWIRE_OPENAI_MODEL: gpt-6
          OPENAI_API_KEY: ${{ secrets.OPENAI_API }}
          AVWIRE_OPENAI_API_MODEL: ${{ secrets.OPENAI_MODEL_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python -u pipeline/retry_luna_token_failures.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luna-token-retry-results
          path: |
            data/paid-budget.json
            data/usage.json
            data/pending.json
            data/industry-roundup-queue.json
            data/articles
            data/luna-token-retry-changed-articles.json
          retention-days: 7
      - name: Persist paid budget
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python pipeline/paid_budget_sync.py persist
