name: free-model-validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/free-model-validation.yml'
      - 'pipeline/providers.py'
      - 'pipeline/write.py'
      - 'pipeline/free_provider_probe.py'
      - 'config/free_provider_probe.json'
  workflow_dispatch:
    inputs:
      provider_order:
        description: '測試分支專用。輸入 JSON 路由陣列，留空測試 GPT-OSS 120B'
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        route: ${{ fromJSON(inputs.provider_order || '["cloudflare:@cf/openai/gpt-oss-120b"]') }}
        case: [h140, qantas-a321xlr, starlux-a350]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compare one route and one public aviation story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || secrets.API_1_NVIDIA_NEMOTRON_3_ULTRA_550B_A55B }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AVWIRE_PROVIDER_ORDER: ${{ matrix.route }}
          AVWIRE_EXPERIMENT_CASE: ${{ matrix.case }}
          AVWIRE_DATA_DIR: ${{ runner.temp }}/free-model-validation
          PYTHONUNBUFFERED: '1'
        run: python pipeline/model_validation_experiment.py
