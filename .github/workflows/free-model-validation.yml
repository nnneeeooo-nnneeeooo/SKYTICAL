name: free-model-validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/free-model-validation.yml'
      - 'pipeline/providers.py'
      - 'pipeline/write.py'
      - 'pipeline/free_provider_probe.py'
      - 'config/free_provider_probe.json'
  workflow_dispatch:
    inputs:
      provider_order:
        description: '僅驗證指定免費路由（留空使用完整清單）'
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        route:
          - 'gemini:gemini-4-hydrogen'
          - 'gemini:gemini-3.8-flash'
          - 'gemini:gemini-3.5-flash-lite'
          - 'gemini:gemma-4-31b-it'
          - 'gemini:gemini-3.6-flash'
          - 'cloudflare:@cf/qwen/qwen3.8-27b'
          - 'cloudflare:@cf/google/gemma-4-26b-a4b-it'
          - 'nvidia:deepseek-ai/deepseek-v4.1-flash'
          - 'nvidia:z-ai/glm-5.3-flash'
          - 'nvidia:mistralai/mistral-large-4-1t-a52b'
          - 'nvidia:nvidia/nemotron-3-ultra-550b-a55b'
          - 'openrouter:inclusionai/ling-3.2-flash:free'
          - 'openrouter:google/gemma-4-31b-it:free'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compare one route across three public aviation stories
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || secrets.API_1_NVIDIA_NEMOTRON_3_ULTRA_550B_A55B }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AVWIRE_PROVIDER_ORDER: ${{ matrix.route }}
          AVWIRE_DATA_DIR: ${{ runner.temp }}/free-model-validation
          PYTHONUNBUFFERED: '1'
        run: python pipeline/model_validation_experiment.py
