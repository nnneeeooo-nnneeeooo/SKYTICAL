name: free-model-validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Prepare temporary output locations
        run: |
          printf 'BENCH_OUTPUT=%s/model-compare\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'AVWIRE_DATA_DIR=%s/model-compare-state\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run isolated shared-source comparison
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API }}
          AVWIRE_PAID_BUDGET_ENABLED: "true"
        run: python pipeline/three_model_benchmark.py
      - name: Encrypt results for local review
        if: always()
        shell: bash
        run: |
          set -eu
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          openssl rand -hex 32 > "$key_file"
          mkdir -p "$RUNNER_TEMP/model-compare-export"
          openssl pkeyutl -encrypt -pubin -inkey config/model-compare-public.pem -in "$key_file" -out "$RUNNER_TEMP/model-compare-export/key.bin" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          tar -C "$BENCH_OUTPUT" -czf - . | openssl enc -aes-256-ctr -pbkdf2 -salt -pass "file:$key_file" -out "$RUNNER_TEMP/model-compare-export/results.bin"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: shared-source-model-comparison
          path: ${{ runner.temp }}/model-compare-export
          retention-days: 1
