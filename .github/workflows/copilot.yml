name: private-copilot-job

on:
  push:
    branches: [main]
    paths:
      - "data/copilot-jobs/inbox/*.json"
  workflow_dispatch:

concurrency:
  group: skytical-paid-api-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh shared paid API budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: python pipeline/paid_budget_sync.py refresh

      - name: Process encrypted Copilot jobs
        env:
          AVWIRE_PAID_BUDGET_ENABLED: "true"
          GH_TOKEN: ${{ github.token }}
          SKYTICAL_COPILOT_ENABLED: ${{ vars.SKYTICAL_COPILOT_ENABLED || 'false' }}
          AI_RATE_LIMIT_PER_MINUTE: ${{ vars.AI_RATE_LIMIT_PER_MINUTE || '8' }}
          AI_DAILY_REQUEST_LIMIT: ${{ vars.AI_DAILY_REQUEST_LIMIT || '50' }}
          AI_EXTERNAL_SEARCH_DAILY_LIMIT: ${{ vars.AI_EXTERNAL_SEARCH_DAILY_LIMIT || '10' }}
          AI_DAILY_BUDGET_LIMIT_USD: ${{ vars.AI_DAILY_BUDGET_LIMIT_USD || '5' }}
          AVWIRE_PROVIDER_ORDER: ${{ vars.AVWIRE_PROVIDER_ORDER }},openai:gpt-6
          OPENAI_API_KEY: ${{ secrets.OPENAI_API }}
          AVWIRE_OPENAI_API_MODEL: ${{ secrets.OPENAI_MODEL_ID }}
          AVWIRE_OPENAI_MODEL: ${{ vars.AVWIRE_OPENAI_MODEL }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || secrets.API_1_NVIDIA_NEMOTRON_3_ULTRA_550B_A55B }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WECHAT_API_KEY: ${{ secrets.DeepSeekV4Flash_API }}
          AVWIRE_MANUAL_TOKEN: ${{ secrets.AVWIRE_MANUAL_TOKEN }}
        run: python pipeline/copilot.py --process-pending

      - name: Save paid API budget recovery snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paid-budget-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/paid-budget.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Persist paid API budget even after failure
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python pipeline/paid_budget_sync.py persist

      - name: Verify encrypted job store
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          allowed = {"version", "alg", "iv", "ciphertext"}
          for path in Path("data/copilot-jobs").glob("*/*.json"):
              row = json.loads(path.read_text(encoding="utf-8"))
              if set(row) != allowed or row.get("version") != 1 or row.get("alg") != "A256GCM":
                  raise SystemExit(f"unencrypted/invalid Copilot job: {path}")
          print("Copilot jobs: encrypted envelopes only")
          PY

      - name: Commit encrypted results and private telemetry
        run: |
          git config user.name "skytical-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/copilot-jobs/outbox data/copilot data/usage.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no Copilot result changes"
            exit 0
          fi
          git commit -m "complete encrypted Copilot job $(date -u +%FT%H:%M)"
          pushed=""
          for i in 1 2 3; do
            if ! git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              sleep 5
              continue
            fi
            if git push; then
              pushed=yes
              break
            fi
            sleep 5
          done
          if [ -z "$pushed" ]; then
            echo "::error::Copilot result could not be pushed after 3 attempts"
            exit 1
          fi
