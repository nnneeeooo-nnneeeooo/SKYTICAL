name: oneoff-oct2026-image-backfill
on:
  push:
    branches:
      - fix/2026-10-month-images
    paths:
      - scripts/_oneoff_image_backfill_20261030.py
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install only required dependencies
        run: pip install -r requirements.txt
      - name: Backfill photos with source-matching rules
        run: python scripts/_oneoff_image_backfill_20261030.py
      - name: Validate JSON and report
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          for p in Path("data/articles").glob("*.json"):
              if p.stat().st_mtime > 0:
                  json.loads(p.read_text(encoding="utf-8"))
          print("All article JSON files parse")
          PY
      - name: Commit one-off news image updates to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/articles/ scripts/_oneoff_image_backfill_report.json
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "fix(news): source-backed image backfill (Oct 2026)"
            git push origin "HEAD:fix/2026-10-month-images"
          fi
