name: pla-series-tests

on:
  push:
    paths:
      - ".github/workflows/pla-tests.yml"
      - "tests/test_pla.py"
      - "pipeline/pla_series.py"
      - "pipeline/common.py"
      - "pipeline/write.py"
      - "requirements.txt"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pla-tests.yml"
      - "tests/test_pla.py"
      - "pipeline/pla_series.py"
      - "pipeline/common.py"
      - "pipeline/write.py"
      - "requirements.txt"

permissions:
  contents: read

concurrency:
  group: pla-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - name: Compile pipeline and tests
        run: python -m compileall -q pipeline tests
      - name: Run standalone PLA checks
        run: python tests/test_pla.py
      - name: Verify pytest collection and isolation
        run: python -m pytest -q tests/test_pla.py
      - name: Verify production data is unchanged
        if: always()
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- data)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            echo "::error::PLA tests modified production data"
            exit 1
          fi
