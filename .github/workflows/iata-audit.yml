name: airport-iata-audit

on:
  schedule:
    # UTC -> Taipei 04:00, 08:00, 12:00, 16:00, 20:00, 00:00.
    - cron: "0 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/iata-audit.yml", "pipeline/iata_audit.py", "tests/test_iata_audit.py", "data/iata-audit/requests/*.json"]
  pull_request:
    branches: [main]
    paths: [".github/workflows/iata-audit.yml", "pipeline/iata_audit.py", "tests/test_iata_audit.py"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_iata_audit.py
      - run: python tests/test_airport_codes.py

  audit:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: skytical-cloud-iata-audit
      cancel-in-progress: false
    permissions:
      contents: write # only data/iata-audit/state.json, never articles or code
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Audit every article in each due four-hour window
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API }}
          AVWIRE_OPENAI_API_MODEL: ${{ secrets.OPENAI_MODEL_ID }}
          GH_TOKEN: ${{ github.token }}
          IATA_AUDIT_OUTPUT_DIR: ${{ runner.temp }}/iata-audit
          PYTHONUNBUFFERED: "1"
        run: python pipeline/iata_audit.py
      - name: Save complete or partial audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iata-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iata-audit
          if-no-files-found: ignore
          retention-days: 30
