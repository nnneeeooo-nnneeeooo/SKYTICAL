name: agentrouter-smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/agentrouter-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check AGENTROUTER_API and call a model
        env:
          AGENTROUTER_API: ${{ secrets.AGENTROUTER_API }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${AGENTROUTER_API:-}" ]; then
            echo "::error::AGENTROUTER_API is missing or unavailable to this workflow"
            exit 1
          fi

          endpoint="https://api.agentrouter.to/api/agentic-api/domains/models/capabilities/chat-complete/execute"
          body='{"routeKey":"models.chat.complete.deepseek.mpp","input":{"model":"deepseek-v4-flash","messages":[{"role":"user","content":"Reply with exactly: OK"}]},"allowFallback":false}'
          code=$(curl -sS -o /tmp/agentrouter.json -w "%{http_code}" \
            "$endpoint" \
            -H "Authorization: Bearer $AGENTROUTER_API" \
            -H "Content-Type: application/json" \
            --data "$body" || true)

          echo "AgentRouter HTTP status: $code"
          python - <<'PY'
          import json, sys
          try:
              data=json.load(open('/tmp/agentrouter.json'))
          except Exception:
              print('Response summary: unavailable')
              sys.exit(1)
          if not isinstance(data, dict):
              print('Response summary: invalid JSON shape')
              sys.exit(1)
          if not data.get('success'):
              msg=data.get('error') or data.get('message') or 'request failed'
              if isinstance(msg, dict):
                  msg=msg.get('message') or msg.get('code') or 'request failed'
              print(f"Response summary: {str(msg)[:180]}")
              sys.exit(1)
          text=(data.get('completionText') or '').strip()
          if not text:
              result=data.get('result') or {}
              if isinstance(result, dict):
                  text=(result.get('completionText') or '').strip()
          print('Model response received:', bool(text))
          if not text:
              print('::error::Successful response did not contain completion text')
              sys.exit(1)
          PY
