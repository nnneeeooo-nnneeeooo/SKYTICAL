name: agentrouter-secret-diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check AgentRouter key, list models, and run a minimal smoke test
        env:
          AGENTROUTER_API: ${{ secrets.AGENTROUTER_API }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          api_key = os.environ.get("AGENTROUTER_API", "")
          if not api_key:
              print("::error::AGENTROUTER_API is missing or empty")
              raise SystemExit(1)

          print(f"SECRET_LENGTH={len(api_key)}")
          print(f"SECRET_HAS_EDGE_WHITESPACE={api_key != api_key.strip()}")
          print(f"SECRET_HAS_LINE_BREAK={chr(10) in api_key or chr(13) in api_key}")
          print(f"SECRET_WRAPPED_IN_QUOTES={len(api_key) >= 2 and api_key[0] == api_key[-1] and api_key[0] in chr(34) + chr(39)}")

          base_url = "https://agentrouter.org/v1"

          def request(path, *, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  base_url + path,
                  data=data,
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                      "User-Agent": "AVWIRE-AgentRouter-Diagnostic/1.0",
                  },
                  method="GET" if payload is None else "POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return (
                          response.status,
                          response.read().decode("utf-8", "replace"),
                          response.headers.get("Content-Type", ""),
                          response.geturl(),
                      )
              except urllib.error.HTTPError as exc:
                  return (
                      exc.code,
                      exc.read().decode("utf-8", "replace"),
                      exc.headers.get("Content-Type", ""),
                      exc.geturl(),
                  )

          status, raw, content_type, final_url = request("/models")
          print(f"MODEL_DISCOVERY={base_url}|bearer|HTTP_{status}")
          print(f"MODELS_CONTENT_TYPE={content_type}")
          print(f"MODELS_FINAL_URL={final_url}")
          print(f"MODELS_BODY_LENGTH={len(raw.encode('utf-8'))}")
          if status != 200:
              print("::error::AgentRouter authentication or model discovery failed")
              raise SystemExit(1)
          print(f"WORKING_BASE_URL={base_url}")
          print("WORKING_AUTH_STYLE=bearer")

          try:
              body = json.loads(raw)
              print(f"MODELS_PAYLOAD_TYPE={type(body).__name__}")
              if isinstance(body, dict):
                  print(f"MODELS_TOP_LEVEL_KEYS={','.join(sorted(body.keys()))}")
              elif isinstance(body, list):
                  print(f"MODELS_TOP_LEVEL_ITEMS={len(body)}")
                  print(
                      "MODELS_FIRST_ITEM_TYPE="
                      f"{type(body[0]).__name__ if body else 'none'}"
                  )
                  if body and isinstance(body[0], dict):
                      print(
                          "MODELS_FIRST_ITEM_KEYS="
                          f"{','.join(sorted(body[0].keys()))}"
                      )

              model_ids = set()
              id_fields = {"id", "model", "model_id", "modelId", "slug"}
              container_fields = {"data", "models", "items", "result", "results"}
              generic_keys = id_fields | container_fields | {
                  "object", "type", "name", "owned_by", "created",
                  "description", "provider", "capabilities",
              }

              def plausible_model_id(value):
                  return (
                      isinstance(value, str)
                      and 1 <= len(value.strip()) <= 160
                      and not any(ch.isspace() for ch in value.strip())
                      and value.strip() not in generic_keys
                  )

              def collect(node, parent=""):
                  if isinstance(node, list):
                      for item in node:
                          if plausible_model_id(item):
                              model_ids.add(item.strip())
                          else:
                              collect(item, parent)
                  elif isinstance(node, dict):
                      for key, value in node.items():
                          if key in id_fields and plausible_model_id(value):
                              model_ids.add(value.strip())
                          if (parent in container_fields and key not in generic_keys
                                  and plausible_model_id(key)):
                              model_ids.add(key.strip())
                          collect(value, key)

              collect(body)
              model_ids = sorted(model_ids)
          except (TypeError, ValueError, json.JSONDecodeError) as exc:
              safe_prefix = raw.replace(api_key, "***")[:240]
              safe_prefix = " ".join(safe_prefix.split())
              print(f"MODELS_BODY_PREFIX={safe_prefix}")
              print(f"MODELS_PARSE_ERROR={type(exc).__name__}:{str(exc)[:200]}")
              print("::warning::AgentRouter did not return a JSON models payload")
              model_ids = []

          print(f"MODEL_COUNT={len(model_ids)}")
          for model_id in model_ids:
              print(f"MODEL={model_id}")
          if not model_ids:
              print("::warning::No model IDs could be discovered from /models")

          preferred = ("gpt-", "glm-", "kimi-", "step", "qwen-", "deepseek-")
          excluded = ("embedding", "rerank", "image", "audio", "tts", "whisper")
          smoke_candidates = [
              model_id for model_id in model_ids
              if not model_id.lower().startswith("claude-")
              and not any(term in model_id.lower() for term in excluded)
          ]
          smoke_model = next(
              (model_id for prefix in preferred for model_id in smoke_candidates
               if model_id.lower().startswith(prefix)),
              smoke_candidates[0] if smoke_candidates else "gpt-5.5",
          )

          print(f"SMOKE_MODEL={smoke_model}")
          print(
              "SMOKE_MODEL_SOURCE="
              + ("models-endpoint" if smoke_candidates else "official-docs-fallback")
          )
          status, raw, content_type, final_url = request("/chat/completions", payload={
              "model": smoke_model,
              "messages": [{"role": "user", "content": "Reply with exactly OK"}],
              "max_tokens": 8,
              "temperature": 0,
              "stream": False,
          })
          print(f"SMOKE_HTTP_STATUS={status}")
          print(f"SMOKE_CONTENT_TYPE={content_type}")
          print(f"SMOKE_FINAL_URL={final_url}")
          if status != 200:
              safe_error = raw.replace(api_key, "***")[:500].replace("\n", " ")
              print(f"SMOKE_ERROR={safe_error}")
              print("::error::Model discovery succeeded but inference failed")
              raise SystemExit(1)

          try:
              result = json.loads(raw)
              content = result["choices"][0]["message"]["content"].strip()
          except (KeyError, IndexError, TypeError, ValueError, json.JSONDecodeError) as exc:
              safe_prefix = raw.replace(api_key, "***")[:240]
              safe_prefix = " ".join(safe_prefix.split())
              print(f"SMOKE_BODY_PREFIX={safe_prefix}")
              print(f"SMOKE_PARSE_ERROR={type(exc).__name__}:{str(exc)[:200]}")
              print("::error::Inference returned an invalid chat-completions payload")
              raise SystemExit(1)
          print(f"SMOKE_RESPONSE={content[:80]}")
          print("AGENTROUTER_API_USABLE=true")
          PY
